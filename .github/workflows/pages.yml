name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  # While Pages is set to "Deploy from a branch", GitHub also publishes the raw repo on every
  # push and can overwrite this deploy. Running again after it finishes makes ours the last one.
  # Harmless (never fires) once Settings > Pages > Source is "GitHub Actions".
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build every demo
        run: node scripts/build-all.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
